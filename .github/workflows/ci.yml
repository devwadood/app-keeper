name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          PAYLOAD_SECRET: ci-payload-secret-with-more-than-24-characters
          CRON_SECRET: ci-cron-secret-with-more-than-16-characters
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appledger_ci
